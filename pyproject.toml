[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsetree3d"
version = "0.1.0"
description = "Sparse-convolution pipeline for urban street-tree instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XiangxiTian" }]
keywords = [
  "point-cloud",
  "instance-segmentation",
  "lidar",
  "urban-forestry",
  "sparse-convolution",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "plyfile>=1.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "tqdm>=4.66",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/XiangxiTian/SparseTree3D"
Repository = "https://github.com/XiangxiTian/SparseTree3D"
Issues = "https://github.com/XiangxiTian/SparseTree3D/issues"

[project.scripts]
sparsetree-evaluate = "sparsetree3d.cli:evaluate_main"
sparsetree-submit = "sparsetree3d.cli:submission_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


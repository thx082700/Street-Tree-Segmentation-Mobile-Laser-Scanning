[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsetree3d"
version = "0.2.0"
description = "Award-winning sparse-convolution pipeline for urban street-tree instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haoxi Tian" }]
keywords = [
  "point-cloud",
  "instance-segmentation",
  "lidar",
  "urban-forestry",
  "sparse-convolution",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "plyfile>=1.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
train = [
  "torch==2.0.*",
  "tqdm>=4.66",
]
competition = [
  "alphashape>=1.3.1",
  "geopandas>=0.12",
  "jakteristics>=0.5.1",
  "laspy[lazrs]>=2.5",
  "munch>=2.5",
  "open3d>=0.17",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "scipy>=1.10",
  "shapely>=2.0",
  "timm==0.6.12",
  "tensorboard>=2.12",
  "tensorboardX>=2.6",
  "tqdm>=4.66",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/thx082700/SparseTree3D"
Repository = "https://github.com/thx082700/SparseTree3D"
Issues = "https://github.com/thx082700/SparseTree3D/issues"

[project.scripts]
sparsetree-evaluate = "sparsetree3d.cli:evaluate_main"
sparsetree-submit = "sparsetree3d.cli:submission_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/tree_learn", "tools/competition"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

seed: 2025

data:
  root: data/WHU-STree-NJ
  train_manifest: data/splits/train.txt
  val_manifest: data/splits/val.txt
  test_manifest: data/splits/test.txt
  voxel_size: 0.08
  num_workers: 4

model:
  in_channels: 4
  base_channels: 32
  pretrained_backbone: null

loss:
  semantic_class_weights: [1.0, 3.0]
  offset_weight: 1.0

train:
  device: cuda
  epochs: 80
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  checkpoint_dir: checkpoints

postprocess:
  tree_probability_threshold: 0.55
  cluster_eps: 0.65
  cluster_min_samples: 8
  min_cluster_points: 35
  fragment_merge_radius: 2.0
  max_horizontal_extent: 10.0
  max_cluster_points: 12000
  max_splits: 4

evaluation:
  iou_threshold: 0.75

